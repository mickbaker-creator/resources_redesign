<!--
  RESOURCE TEMPLATE — Form Tray (Block 4 of 5)
  ═════════════════════════════════════════════════════
  WordPress: Paste as a Custom HTML block AFTER all content blocks.
  The overlay and tray use position:fixed so DOM position doesn't
  affect visual rendering, but they must be present before 05-scripts.html.

  Uses Employment Hero's marketo-form-v2 WordPress plugin.
  The plugin renders and submits the Marketo form automatically.

  CONFIGURE the data-marketo-form JSON attribute in the body below:
  · form_id — Marketo form ID for this resource
  · base_url / munchkin_id — Marketo instance (AU or UK)
  · thank_you_page_url — confirmation page after submission

  Requires: 00-styles.html on the same page.
═════════════════════════════════════════════════════ -->

<div class="eh-resource-landing">

  <!-- Backdrop overlay (click to close) -->
  <div
    id="eh-form-overlay"
    class="eh-form-overlay"
    aria-hidden="true"
  ></div>

  <!-- Slide-out dialog tray -->
  <div
    id="eh-form-tray"
    class="eh-form-tray"
    role="dialog"
    aria-modal="true"
    aria-labelledby="eh-form-dialog-title"
    aria-hidden="true"
  >

    <!-- Sticky tray header -->
    <div class="eh-form-header">
      <div class="eh-form-header-left">
        <div class="eh-form-icon" aria-hidden="true">
          <svg focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </div>
        <h2 id="eh-form-dialog-title" class="eh-form-heading">Download for free</h2>
      </div>
      <button
        type="button"
        id="eh-form-close"
        class="eh-form-close"
        data-close-form
        aria-label="Close download form"
      >
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Tray body — scrollable -->
    <div class="eh-form-body">

      <!-- Loading indicator — auto-hides once Marketo renders the form -->
      <div class="eh-form-loading" aria-live="polite">Loading download form&hellip;</div>

      <!-- Marketo form-v2 container.
           Rendered by Employment Hero's marketo-form-v2 WordPress plugin.
           CONFIGURE: update form_id and thank_you_page_url per resource. -->
      <div
        class="eh_marketo_form-container_v2"
        data-marketo-form='{"is_multi_steps":false,"form_data":[{"base_url":"//hr.employmenthero.io","munchkin_id":"387-SZZ-170","form_id":"PLACEHOLDER_FORM_ID","css_classes":""}],"submit_text":"Download now","success_handling_method":"thank_you_page","thank_you_page_url":"https://employmenthero.com/thank-you/downloadable/","progress_indicator_type":"progress-bar","enable_revenue_hero":false}'
      ></div>

    </div><!-- /eh-form-body -->

  </div><!-- /eh-form-tray -->

</div><!-- /eh-resource-landing -->
