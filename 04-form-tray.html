<!--
  Marketo forms2 script note:
  MktoForms2 is loaded globally by the EH theme/GTM — no explicit
  script tag needed here. The initMarketoForm() function below
  polls for it with a short retry loop.
-->

<div class="eh-resource-landing">

  <!-- Backdrop overlay (click to close) -->
  <div
    id="eh-form-overlay"
    class="eh-form-overlay"
    aria-hidden="true"
  ></div>

  <!-- Slide-out dialog tray -->
  <div
    id="eh-form-tray"
    class="eh-form-tray"
    role="dialog"
    aria-modal="true"
    aria-labelledby="eh-form-dialog-title"
    aria-hidden="true"
  >

    <!-- Sticky tray header -->
    <div class="eh-form-header">
      <div class="eh-form-header-left">
        <div class="eh-form-icon" aria-hidden="true">
          <svg focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </div>
        <h2 id="eh-form-dialog-title" class="eh-form-heading">Download for free</h2>
      </div>
      <button
        type="button"
        id="eh-form-close"
        class="eh-form-close"
        data-close-form
        aria-label="Close download form"
      >
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Tray body -->
    <div class="eh-form-body">
      <!-- Loading indicator — hidden once Marketo form renders -->
      <div class="eh-form-loading" id="eh-form-loading" aria-live="polite" aria-label="Loading form">
        Loading form…
      </div>

      <!-- Marketo form target — Marketo populates this element -->
      <form id="mktoForm_1737"></form>
    </div>

  </div><!-- /eh-form-tray -->

</div><!-- /eh-resource-landing -->
<!--
  Marketo form init is handled by 05-scripts.html (initMarketoForm).
  This block is HTML only — no script tag.
-->
