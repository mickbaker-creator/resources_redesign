<!--
  RESOURCE TEMPLATE — Marketo Form Tray (Block 4 of 5)
  ═════════════════════════════════════════════════════
  WordPress: Paste as a Custom HTML block AFTER all content blocks.
  The overlay and tray use position:fixed so DOM position doesn't
  affect visual rendering, but they must be present before 05-scripts.html.

  MARKETO FORM: ID 1737 | Account: 387-SZZ-170 | Instance: hr.employmenthero.io
  On successful submission, the user is redirected to the thank-you page below.

  Requires: 00-styles.html on the same page.
═════════════════════════════════════════════════════ -->

<!--
  Marketo forms2 script note:
  MktoForms2 is loaded globally by the EH theme/GTM — no explicit
  script tag needed here. The initMarketoForm() function below
  polls for it with a short retry loop.
-->

<div class="eh-resource-landing">

  <!-- Backdrop overlay (click to close) -->
  <div
    id="eh-form-overlay"
    class="eh-form-overlay"
    aria-hidden="true"
  ></div>

  <!-- Slide-out dialog tray -->
  <div
    id="eh-form-tray"
    class="eh-form-tray"
    role="dialog"
    aria-modal="true"
    aria-labelledby="eh-form-dialog-title"
    aria-hidden="true"
  >

    <!-- Sticky tray header -->
    <div class="eh-form-header">
      <div class="eh-form-header-left">
        <div class="eh-form-icon" aria-hidden="true">
          <svg focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </div>
        <h2 id="eh-form-dialog-title" class="eh-form-heading">Download for free</h2>
      </div>
      <button
        type="button"
        id="eh-form-close"
        class="eh-form-close"
        data-close-form
        aria-label="Close download form"
      >
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Tray body -->
    <div class="eh-form-body">
      <!-- Loading indicator — hidden once Marketo form renders -->
      <div class="eh-form-loading" id="eh-form-loading" aria-live="polite" aria-label="Loading form">
        Loading form…
      </div>

      <!-- Marketo form target — Marketo populates this element -->
      <form id="mktoForm_1737"></form>
    </div>

  </div><!-- /eh-form-tray -->

</div><!-- /eh-resource-landing -->

<script>
(function () {
  'use strict';

  var REDIRECT_URL = 'https://employmenthero.com/thank-you/downloadable/?origin=current-trends-recruitment';

  var mktoRetries = 0;
  var MKTO_MAX_RETRIES = 20; // 10 seconds before showing fallback

  function showFormError() {
    var loader = document.getElementById('eh-form-loading');
    if (loader) {
      loader.innerHTML =
        'The form couldn\'t load — please try refreshing the page, ' +
        'or <a href="mailto:hello@employmenthero.com">contact us</a> ' +
        'to get the report sent directly.';
    }
  }

  function initMarketoForm() {
    if (typeof MktoForms2 === 'undefined') {
      mktoRetries++;
      if (mktoRetries >= MKTO_MAX_RETRIES) {
        console.error('[EH Form] MktoForms2 still undefined after ' + MKTO_MAX_RETRIES + ' retries.');
        showFormError();
        return;
      }
      // Marketo script hasn't loaded yet — retry after a short delay
      setTimeout(initMarketoForm, 500);
      return;
    }

    // ── whenReady fires when form 1737 renders, regardless of who
    //    triggered the load. More reliable than the loadForm callback.
    MktoForms2.whenReady(function (form) {
      if (form.getId() !== 1737) return; // guard: only affect our form

      var formEl = form.getFormElem()[0];

      // ── Strip Marketo's injected inline styles ──────────────────
      formEl.removeAttribute('style');
      formEl.querySelectorAll('[style]').forEach(function (el) {
        el.removeAttribute('style');
      });

      // ── Disable Marketo's own stylesheet ─────────────────────────
      document.querySelectorAll('link[href*="forms2"]').forEach(function (link) {
        link.disabled = true;
      });

      // ── Update hint texts ────────────────────────────────────────
      var hintOverrides = {
        'InstructEmail':             'This lets us send important updates related to your enquiry.',
        'InstructNumberOfEmployees': 'This helps us recommend the right solutions and resources.'
      };
      Object.keys(hintOverrides).forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.textContent = hintOverrides[id];
      });

      // ── Country: inject a placeholder option ─────────────────────
      var countrySelect = document.getElementById('Country');
      if (countrySelect && countrySelect.options[0] && countrySelect.options[0].value !== '') {
        var countryPlaceholder = document.createElement('option');
        countryPlaceholder.value = '';
        countryPlaceholder.textContent = 'Country';
        countryPlaceholder.disabled = true;
        countryPlaceholder.selected = true;
        countrySelect.insertBefore(countryPlaceholder, countrySelect.firstChild);
      }

      // ── Move submit button to sticky footer ──────────────────────
      var tray      = document.getElementById('eh-form-tray');
      var formBody  = tray && tray.querySelector('.eh-form-body');
      var buttonRow = formEl.querySelector('.mktoButtonRow');
      if (tray && formBody && buttonRow) {
        var footer = document.createElement('div');
        footer.className = 'eh-form-footer';
        footer.appendChild(buttonRow);
        formBody.insertAdjacentElement('afterend', footer);
      }

      // ── Auto-scroll to next empty field after each field fills ───
      var scrollableBody = tray && tray.querySelector('.eh-form-body');
      var allFields = Array.from(formEl.querySelectorAll(
        'input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]), select'
      ));

      allFields.forEach(function (field, index) {
        var evt = field.tagName === 'SELECT' ? 'change' : 'blur';
        field.addEventListener(evt, function () {
          if (!field.value) return;
          var nextField = null;
          for (var i = index + 1; i < allFields.length; i++) {
            if (!allFields[i].value) { nextField = allFields[i]; break; }
          }
          if (nextField && scrollableBody) {
            var row = nextField.closest('.mktoFormRow') || nextField.parentElement;
            requestAnimationFrame(function () {
              row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
          }
        });
      });

      // ── Override submit button text ──────────────────────────────
      var submitBtn = formEl.querySelector('.mktoButton');
      if (submitBtn) submitBtn.textContent = 'Download now';

      // ── Redirect on successful submission ────────────────────────
      form.onSuccess(function () {
        window.location.href = REDIRECT_URL;
        return false;
      });
    });

    // ── Trigger the form to load ─────────────────────────────────
    // whenReady above handles all customisation once it renders.
    try {
      MktoForms2.loadForm('https://hr.employmenthero.io', '387-SZZ-170', 1737);
    } catch (e) {
      console.error('[EH Form] MktoForms2.loadForm threw an error:', e);
      showFormError();
    }
  }

  // Initialise when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMarketoForm);
  } else {
    initMarketoForm();
  }
})();
</script>
