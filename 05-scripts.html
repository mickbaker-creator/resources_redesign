<!--
  RESOURCE TEMPLATE — Scripts (Block 5 of 5)
  ═══════════════════════════════════════════
  WordPress: Paste as the LAST Custom HTML block on the page,
  after all other resource template blocks.

  Handles:
  · Form tray open / close with focus management + focus trap
  · ARIA state (aria-expanded, aria-hidden) on triggers + tray
  · Image preview carousel with keyboard + ARIA support
  · dataLayer tracking for all tagged interactions
  · Marketo form initialisation

  CONFIGURE: Update RESOURCE_NAME and RESOURCE_TYPE below
  to match the specific resource on this page.

  NOTE: All && operators have been replaced with nested if()
  statements, and all block comments use // instead of slash-star
  to prevent WordPress from corrupting the script on save.
════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  // RESOURCE METADATA — update these values for each resource page.
  var RESOURCE_NAME = '2025 Hiring Snapshot Report: Current Trends in Recruitment';
  var RESOURCE_TYPE = 'Report';

  var REDIRECT_URL = 'https://employmenthero.com/thank-you/downloadable/?origin=current-trends-recruitment';

  // MARKETO FORM — update per resource / region.
  // AU instance:  base = 'https://hr.employmenthero.io',  munchkin = '387-SZZ-170'
  // UK instance:  base = 'https://???',                    munchkin = '???'
  var FORM_ID         = 1737;
  var MKTO_BASE_URL   = 'https://hr.employmenthero.io';
  var MKTO_MUNCHKIN   = '387-SZZ-170';
  var COUNTRY_DEFAULT = 'Australia'; // Change to 'United Kingdom' for UK forms.

  // NOTE: Required asterisk on checkboxes is handled via CSS in 00-styles.html,
  // using :has(#LblOpted_In_GDPR__c) to exclude the marketing opt-in field.
  // No JS injection needed.

  function init() {
    initFullBleed();
    initTracking();
    initFormTray();
    initCarousels();
    initInfoPopovers();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // ============================================================
  // FULL-BLEED BREAKOUT
  // Adds .alignfull to each .wp-block-html wrapper so Gutenberg
  // expands it to full viewport width. Belt-and-suspenders for
  // the :has() CSS rule in 00-styles.html.
  // ============================================================
  function initFullBleed() {
    document.querySelectorAll('.eh-resource-landing').forEach(function (landing) {
      var block = landing.closest('.wp-block-html');
      if (block) {
        block.classList.add('alignfull');
      }
    });
  }

  // ============================================================
  // DATALAYER TRACKING
  // Event delegation on document — works with dynamic content.
  // Tag elements with data-gtm-event and data-gtm-label.
  // ============================================================
  function initTracking() {
    window.dataLayer = window.dataLayer || [];

    document.addEventListener('click', function (e) {
      var tracked = e.target.closest('[data-gtm-event]');
      if (!tracked) return;

      window.dataLayer.push({
        event:             'resource_page_interaction',
        interaction_type:  tracked.dataset.gtmEvent  || '',
        interaction_label: tracked.dataset.gtmLabel  || '',
        resource_name:     RESOURCE_NAME,
        resource_type:     RESOURCE_TYPE
      });
    });
  }

  // ============================================================
  // FORM TRAY
  // Opens as a slide-in dialog with a backdrop overlay.
  // Moves focus into the tray on open; returns it on close.
  // Traps focus while open. Closes on backdrop click or Escape.
  // ============================================================
  function initFormTray() {
    var tray    = document.getElementById('eh-form-tray');
    var overlay = document.getElementById('eh-form-overlay');

    if (!tray) return;
    if (!overlay) return;

    var openButtons  = document.querySelectorAll('[data-open-form]');
    var closeButtons = document.querySelectorAll('[data-close-form]');
    var lastFocused  = null;

    // ── Open ──
    function openTray(triggerEl) {
      lastFocused = triggerEl || document.activeElement;

      tray.classList.add('open');
      overlay.classList.add('open');

      tray.removeAttribute('aria-hidden');
      overlay.setAttribute('aria-hidden', 'true');

      document.body.style.overflow = 'hidden';

      openButtons.forEach(function (btn) {
        btn.setAttribute('aria-expanded', 'true');
      });

      requestAnimationFrame(function () {
        var first = getFirstFocusable(tray);
        if (first) first.focus();
      });

      document.addEventListener('keydown', handleTrapFocus);
    }

    // ── Close ──
    function closeTray() {
      tray.classList.remove('open');
      overlay.classList.remove('open');

      tray.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';

      openButtons.forEach(function (btn) {
        btn.setAttribute('aria-expanded', 'false');
      });

      document.removeEventListener('keydown', handleTrapFocus);

      if (lastFocused) {
        if (typeof lastFocused.focus === 'function') {
          lastFocused.focus();
          lastFocused = null;
        }
      }
    }

    // ── Focus trap ──
    function handleTrapFocus(e) {
      if (e.key === 'Escape') {
        closeTray();
        return;
      }

      if (e.key !== 'Tab') return;

      var focusableEls = getFocusable(tray);
      if (!focusableEls.length) return;

      var first = focusableEls[0];
      var last  = focusableEls[focusableEls.length - 1];

      if (e.shiftKey) {
        if (document.activeElement === first) {
          e.preventDefault();
          last.focus();
        }
      } else {
        if (document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }
    }

    // ── Wire up events ──
    openButtons.forEach(function (btn) {
      btn.addEventListener('click', function () { openTray(btn); });
    });

    closeButtons.forEach(function (btn) {
      btn.addEventListener('click', closeTray);
    });

    overlay.addEventListener('click', closeTray);
  }

  // ============================================================
  // IMAGE PREVIEW CAROUSEL
  // Syncs main image, thumbnail state, and counter.
  // Updates aria-pressed on thumbs and alt text on main image.
  // ============================================================
  function initCarousels() {
    var carousels = document.querySelectorAll('[data-carousel]');

    carousels.forEach(function (carousel) {
      var mainImg = carousel.querySelector('[data-carousel-img]');
      var thumbs  = carousel.querySelectorAll('[data-carousel-thumb]');
      var prevBtn = carousel.querySelector('[data-carousel-prev]');
      var nextBtn = carousel.querySelector('[data-carousel-next]');
      var counter = carousel.querySelector('[data-carousel-counter]');

      if (!mainImg) return;
      if (!thumbs.length) return;

      var currentIndex = 0;

      // Derive full-size srcs from thumb srcs (thumbs use -thumb suffix).
      var images = Array.from(thumbs).map(function (thumb) {
        var img = thumb.querySelector('img');
        if (!img) return '';
        return img.src.replace('-thumb', '');
      }).filter(Boolean);

      if (!images.length) return;

      function goTo(index) {
        currentIndex = (index + images.length) % images.length;

        mainImg.src = images[currentIndex];
        mainImg.alt = 'Report preview page ' + (currentIndex + 1) + ' of ' + images.length;

        thumbs.forEach(function (thumb, i) {
          var isActive = i === currentIndex;
          thumb.classList.toggle('active', isActive);
          thumb.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });

        if (counter) {
          counter.textContent = (currentIndex + 1) + ' / ' + images.length;
        }

        // Show glass overlay with download nudge on the last slide.
        carousel.classList.toggle('is-last-slide', currentIndex === images.length - 1);
      }

      thumbs.forEach(function (thumb, i) {
        thumb.addEventListener('click', function () { goTo(i); });
      });

      if (prevBtn) prevBtn.addEventListener('click', function () { goTo(currentIndex - 1); });
      if (nextBtn) nextBtn.addEventListener('click', function () { goTo(currentIndex + 1); });
    });
  }

  // ============================================================
  // MARKETO FORM INIT
  // On production the EH theme pre-loads forms2.min.js so MktoForms2
  // is available immediately. On other pages (QA, previews) it may
  // not be, causing a multi-second polling delay.
  // Fix: inject forms2.min.js ourselves if it isn't already present,
  // then call setupMarketoForm() directly — no polling needed.
  // ============================================================

  function showFormError() {
    var loader = document.querySelector('.eh-form-loading');
    if (loader) {
      loader.innerHTML = 'The form could not load. Please try refreshing the page.';
    }
  }

  // setupMarketoForm — assumes MktoForms2 is already defined.
  // Registers the whenReady callback then calls loadForm.
  function setupMarketoForm() {

    MktoForms2.whenReady(function (form) {
      if (form.getId() !== FORM_ID) return;

      var formEl = form.getFormElem()[0];

      // Strip Marketo inline styles
      formEl.removeAttribute('style');
      formEl.querySelectorAll('[style]').forEach(function (el) {
        el.removeAttribute('style');
      });

      // Disable Marketo stylesheet
      document.querySelectorAll('link[href*="forms2"]').forEach(function (link) {
        link.disabled = true;
      });

      // Update hint texts. Finds each field by its Marketo field ID, then
      // targets the .mktoInstruction in the same row — more reliable than
      // the InstructXxx IDs which may not exist depending on form config.
      function setHint(fieldId, text) {
        var field = formEl.querySelector('#' + fieldId);
        if (!field) return;
        var row = field.closest('.mktoFormRow');
        if (!row) return;
        var hint = row.querySelector('.mktoInstruction');
        if (hint) hint.textContent = text;
      }
      setHint('Email',             'This lets us send important updates related to your enquiry.');
      setHint('Company',           'This helps us understand your business and industry better.');
      setHint('Industry',          'This helps us understand your business and industry better.');
      setHint('NumberOfEmployees', 'This helps us recommend the right solutions and resources.');

      // Required asterisk on checkbox/radio labels.
      // The outer .mktoLabel is hidden by our CSS (display:none).
      // We inject a visible marker into the inner label of each
      // required field, excluding the marketing opt-in whose outer
      // label has id="LblOpted_In_GDPR__c" (confirmed from live source).
      formEl.querySelectorAll('.mktoFieldWrap.mktoRequiredField').forEach(function (wrap) {
        var outerLabel = wrap.querySelector('.mktoLabel');
        if (!outerLabel) return;
        if (outerLabel.id === 'LblOpted_In_GDPR__c') return;
        wrap.querySelectorAll('.mktoLogicalField label').forEach(function (lbl) {
          if (lbl.querySelector('.eh-required-mark')) return;
          var req = document.createElement('span');
          req.setAttribute('aria-hidden', 'true');
          req.className = 'eh-required-mark';
          req.textContent = '* ';
          lbl.insertBefore(req, lbl.firstChild);
        });
      });

      // Country field.
      // Run in a setTimeout so our code fires AFTER any Marketo post-render
      // processing that may reset the select value.
      // 1. Always inject a visible "Country" placeholder option at position 0
      //    so the field is never silently blank.
      // 2. Try to pre-select COUNTRY_DEFAULT — if it matches an option the
      //    placeholder is deselected automatically.
      // Also used here to set visible placeholder labels on other select fields
      // (Role / Job Title) whose default blank option shows generic "Select" text.
      //
      // NOTE: <select> has no native placeholder attribute — browsers ignore it.
      // The workaround: ensure the blank first option has descriptive text, do NOT
      // set disabled until AFTER programmatic selection (disabled options can't be
      // selected programmatically in some browsers), then add .eh-select-placeholder
      // class so CSS can style it like a text input placeholder (grey text).
      setTimeout(function () {

        function setSelectLabel(fieldId, text) {
          var sel = document.getElementById(fieldId);
          if (!sel) return;
          // Find existing blank option or the first option if its value is empty/whitespace
          var ph = sel.querySelector('option[value=""]');
          if (!ph && sel.options.length > 0) {
            if (!sel.options[0].value.trim()) ph = sel.options[0];
          }
          if (ph) {
            ph.textContent = text;
          } else {
            ph = document.createElement('option');
            ph.value = '';
            ph.textContent = text;
            sel.insertBefore(ph, sel.firstChild);
          }
          // Select the placeholder first (before disabling — disabled options
          // can't be programmatically selected in Firefox/Safari)
          ph.selected = true;
          ph.disabled = true;
          // Add class so CSS can apply placeholder-style colour
          sel.classList.add('eh-select-placeholder');
          sel.addEventListener('change', function () {
            sel.classList.toggle('eh-select-placeholder', !sel.value);
          });
        }

        // Role / Job Title — replace generic "Select" with descriptive label.
        // If the Marketo field ID differs from 'Title', update it here.
        setSelectLabel('Title', 'Role / Job Title');

        // Country — set visible label, then try to pre-select COUNTRY_DEFAULT.
        setSelectLabel('Country', 'Country');
        var countrySelect = document.getElementById('Country');
        if (countrySelect) {
          countrySelect.value = COUNTRY_DEFAULT;
          if (countrySelect.value === COUNTRY_DEFAULT) {
            // Successfully pre-selected — remove placeholder styling
            countrySelect.classList.remove('eh-select-placeholder');
          }
        }
      }, 500);

      // Set submit button text BEFORE moving the button row out of formEl.
      // (After appendChild moves btnRow, formEl.querySelector can no longer find .mktoButton.)
      var tray    = document.getElementById('eh-form-tray');
      var btnRow  = formEl.querySelector('.mktoButtonRow');
      var submitBtn = btnRow ? btnRow.querySelector('.mktoButton') : null;
      if (submitBtn) submitBtn.textContent = 'Download now';
      // Re-associate the button with the form after it gets moved outside <form>.
      // Without this, the button has no form owner and submit never fires.
      if (submitBtn) submitBtn.setAttribute('form', 'mktoForm_' + FORM_ID);

      // Move submit button row to sticky footer
      if (tray) {
        var formBody = tray.querySelector('.eh-form-body');
        if (formBody) {
          if (btnRow) {
            var footer = document.createElement('div');
            footer.className = 'eh-form-footer';
            footer.appendChild(btnRow);
            formBody.insertAdjacentElement('afterend', footer);
          }
        }
      }

      // Green tick + auto-scroll: runs on blur (text) / change (select)
      var scrollBody = tray ? tray.querySelector('.eh-form-body') : null;
      var allFields  = Array.from(formEl.querySelectorAll(
        'input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]), select'
      ));
      allFields.forEach(function (field, index) {
        var evt = field.tagName === 'SELECT' ? 'change' : 'blur';
        field.addEventListener(evt, function () {
          // Apply / remove green tick class based on whether field has a value
          if (field.value) {
            field.classList.add('mktoValid');
          } else {
            field.classList.remove('mktoValid');
          }
          // Auto-scroll to next empty field
          if (!field.value) return;
          var next = null;
          for (var i = index + 1; i < allFields.length; i++) {
            if (!allFields[i].value) { next = allFields[i]; break; }
          }
          if (next) {
            if (scrollBody) {
              var row = next.closest('.mktoFormRow') || next.parentElement;
              requestAnimationFrame(function () {
                row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
              });
            }
          }
        });
      });

      // Redirect on successful submission
      form.onSuccess(function () {
        window.location.href = REDIRECT_URL;
        return false;
      });
    });

    try {
      MktoForms2.loadForm(MKTO_BASE_URL, MKTO_MUNCHKIN, FORM_ID);
    } catch (e) {
      showFormError();
    }
  }

  // initMarketoForm — loads forms2.min.js if needed, then calls setupMarketoForm.
  // On production the theme has already loaded the library so we go straight to
  // setupMarketoForm. On QA/preview pages we inject the script ourselves, which
  // cuts the form render delay from ~5 s (polling) to < 1 s (network only).
  function initMarketoForm() {
    if (typeof MktoForms2 !== 'undefined') {
      setupMarketoForm();
      return;
    }
    var script = document.createElement('script');
    script.src = MKTO_BASE_URL + '/js/forms2/js/forms2.min.js';
    script.onload = setupMarketoForm;
    script.onerror = showFormError;
    document.head.appendChild(script);
  }

  // Fire on DOMContentLoaded — page structure is ready, no need to wait
  // for images / iframes that delay the window load event.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMarketoForm);
  } else {
    initMarketoForm();
  }

  // ============================================================
  // BUNDLE INFO POPOVERS
  // Small tooltip panels triggered by (i) buttons on bundle list items.
  // Closes on outside click, Escape key, or opening another popover.
  // ============================================================
  function initInfoPopovers() {
    var btns = document.querySelectorAll('[data-info]');
    if (!btns.length) return;

    function closeAllPopovers() {
      document.querySelectorAll('.eh-info-popover').forEach(function (p) {
        p.hidden = true;
      });
      document.querySelectorAll('[data-info]').forEach(function (b) {
        b.setAttribute('aria-expanded', 'false');
      });
    }

    btns.forEach(function (btn) {
      var popoverId = btn.getAttribute('data-info');
      var popover   = popoverId ? document.getElementById(popoverId) : null;
      if (!popover) return;

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var isOpen = !popover.hidden;
        closeAllPopovers();
        if (!isOpen) {
          popover.hidden = false;
          btn.setAttribute('aria-expanded', 'true');
        }
      });
    });

    document.addEventListener('click', closeAllPopovers);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeAllPopovers();
    });
  }

  // ============================================================
  // HELPERS
  // ============================================================
  var FOCUSABLE_SELECTOR = [
    'a[href]',
    'button:not([disabled])',
    'input:not([disabled])',
    'select:not([disabled])',
    'textarea:not([disabled])',
    '[tabindex]:not([tabindex="-1"])'
  ].join(', ');

  function getFocusable(container) {
    return Array.from(container.querySelectorAll(FOCUSABLE_SELECTOR))
      .filter(function (el) { return !el.closest('[hidden]'); });
  }

  function getFirstFocusable(container) {
    return getFocusable(container)[0] || null;
  }

})();
</script>
