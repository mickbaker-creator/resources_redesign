<!--
  RESOURCE TEMPLATE — Scripts (Block 5 of 5)
  ═══════════════════════════════════════════
  WordPress: Paste as the LAST Custom HTML block on the page,
  after all other resource template blocks.

  Handles:
  · Form tray open / close with focus management + focus trap
  · ARIA state (aria-expanded, aria-hidden) on triggers + tray
  · Image preview carousel with keyboard + ARIA support
  · dataLayer tracking for all tagged interactions
  · Marketo form initialisation

  CONFIGURE: Update RESOURCE_NAME and RESOURCE_TYPE below
  to match the specific resource on this page.

  NOTE: All && operators have been replaced with nested if()
  statements, and all block comments use // instead of slash-star
  to prevent WordPress from corrupting the script on save.
════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  // RESOURCE METADATA — update these values for each resource page.
  var RESOURCE_NAME = '2025 Hiring Snapshot Report: Current Trends in Recruitment';
  var RESOURCE_TYPE = 'Report';

  var REDIRECT_URL = 'https://employmenthero.com/thank-you/downloadable/?origin=current-trends-recruitment';

  function init() {
    initFullBleed();
    initTracking();
    initFormTray();
    initCarousels();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // ============================================================
  // FULL-BLEED BREAKOUT
  // Adds .alignfull to each .wp-block-html wrapper so Gutenberg
  // expands it to full viewport width. Belt-and-suspenders for
  // the :has() CSS rule in 00-styles.html.
  // ============================================================
  function initFullBleed() {
    document.querySelectorAll('.eh-resource-landing').forEach(function (landing) {
      var block = landing.closest('.wp-block-html');
      if (block) {
        block.classList.add('alignfull');
      }
    });
  }

  // ============================================================
  // DATALAYER TRACKING
  // Event delegation on document — works with dynamic content.
  // Tag elements with data-gtm-event and data-gtm-label.
  // ============================================================
  function initTracking() {
    window.dataLayer = window.dataLayer || [];

    document.addEventListener('click', function (e) {
      var tracked = e.target.closest('[data-gtm-event]');
      if (!tracked) return;

      window.dataLayer.push({
        event:             'resource_page_interaction',
        interaction_type:  tracked.dataset.gtmEvent  || '',
        interaction_label: tracked.dataset.gtmLabel  || '',
        resource_name:     RESOURCE_NAME,
        resource_type:     RESOURCE_TYPE
      });
    });
  }

  // ============================================================
  // FORM TRAY
  // Opens as a slide-in dialog with a backdrop overlay.
  // Moves focus into the tray on open; returns it on close.
  // Traps focus while open. Closes on backdrop click or Escape.
  // ============================================================
  function initFormTray() {
    var tray    = document.getElementById('eh-form-tray');
    var overlay = document.getElementById('eh-form-overlay');

    if (!tray) return;
    if (!overlay) return;

    var openButtons  = document.querySelectorAll('[data-open-form]');
    var closeButtons = document.querySelectorAll('[data-close-form]');
    var lastFocused  = null;

    // ── Open ──
    function openTray(triggerEl) {
      lastFocused = triggerEl || document.activeElement;

      tray.classList.add('open');
      overlay.classList.add('open');

      tray.removeAttribute('aria-hidden');
      overlay.setAttribute('aria-hidden', 'true');

      document.body.style.overflow = 'hidden';

      openButtons.forEach(function (btn) {
        btn.setAttribute('aria-expanded', 'true');
      });

      requestAnimationFrame(function () {
        var first = getFirstFocusable(tray);
        if (first) first.focus();
      });

      document.addEventListener('keydown', handleTrapFocus);
    }

    // ── Close ──
    function closeTray() {
      tray.classList.remove('open');
      overlay.classList.remove('open');

      tray.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';

      openButtons.forEach(function (btn) {
        btn.setAttribute('aria-expanded', 'false');
      });

      document.removeEventListener('keydown', handleTrapFocus);

      if (lastFocused) {
        if (typeof lastFocused.focus === 'function') {
          lastFocused.focus();
          lastFocused = null;
        }
      }
    }

    // ── Focus trap ──
    function handleTrapFocus(e) {
      if (e.key === 'Escape') {
        closeTray();
        return;
      }

      if (e.key !== 'Tab') return;

      var focusableEls = getFocusable(tray);
      if (!focusableEls.length) return;

      var first = focusableEls[0];
      var last  = focusableEls[focusableEls.length - 1];

      if (e.shiftKey) {
        if (document.activeElement === first) {
          e.preventDefault();
          last.focus();
        }
      } else {
        if (document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }
    }

    // ── Wire up events ──
    openButtons.forEach(function (btn) {
      btn.addEventListener('click', function () { openTray(btn); });
    });

    closeButtons.forEach(function (btn) {
      btn.addEventListener('click', closeTray);
    });

    overlay.addEventListener('click', closeTray);
  }

  // ============================================================
  // IMAGE PREVIEW CAROUSEL
  // Syncs main image, thumbnail state, and counter.
  // Updates aria-pressed on thumbs and alt text on main image.
  // ============================================================
  function initCarousels() {
    var carousels = document.querySelectorAll('[data-carousel]');

    carousels.forEach(function (carousel) {
      var mainImg = carousel.querySelector('[data-carousel-img]');
      var thumbs  = carousel.querySelectorAll('[data-carousel-thumb]');
      var prevBtn = carousel.querySelector('[data-carousel-prev]');
      var nextBtn = carousel.querySelector('[data-carousel-next]');
      var counter = carousel.querySelector('[data-carousel-counter]');

      if (!mainImg) return;
      if (!thumbs.length) return;

      var currentIndex = 0;

      // Derive full-size srcs from thumb srcs (thumbs use -thumb suffix).
      var images = Array.from(thumbs).map(function (thumb) {
        var img = thumb.querySelector('img');
        if (!img) return '';
        return img.src.replace('-thumb', '');
      }).filter(Boolean);

      if (!images.length) return;

      function goTo(index) {
        currentIndex = (index + images.length) % images.length;

        mainImg.src = images[currentIndex];
        mainImg.alt = 'Report preview page ' + (currentIndex + 1) + ' of ' + images.length;

        thumbs.forEach(function (thumb, i) {
          var isActive = i === currentIndex;
          thumb.classList.toggle('active', isActive);
          thumb.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });

        if (counter) {
          counter.textContent = (currentIndex + 1) + ' / ' + images.length;
        }

        // Show glass overlay with download nudge on the last slide.
        carousel.classList.toggle('is-last-slide', currentIndex === images.length - 1);
      }

      thumbs.forEach(function (thumb, i) {
        thumb.addEventListener('click', function () { goTo(i); });
      });

      if (prevBtn) prevBtn.addEventListener('click', function () { goTo(currentIndex - 1); });
      if (nextBtn) nextBtn.addEventListener('click', function () { goTo(currentIndex + 1); });
    });
  }

  // ============================================================
  // MARKETO FORM INIT
  // Runs at window.load so the EH theme has time to define
  // MktoForms2 before we start polling for it.
  // ============================================================
  var mktoRetries = 0;
  var MKTO_MAX_RETRIES = 60;

  function showFormError() {
    var loader = document.querySelector('.eh-form-loading');
    if (loader) {
      loader.innerHTML = 'The form could not load. Please try refreshing the page.';
    }
  }

  function initMarketoForm() {
    if (typeof MktoForms2 === 'undefined') {
      mktoRetries++;
      if (mktoRetries >= MKTO_MAX_RETRIES) {
        showFormError();
        return;
      }
      setTimeout(initMarketoForm, 500);
      return;
    }

    MktoForms2.whenReady(function (form) {
      if (form.getId() !== 1737) return;

      var formEl = form.getFormElem()[0];

      // Strip Marketo inline styles
      formEl.removeAttribute('style');
      formEl.querySelectorAll('[style]').forEach(function (el) {
        el.removeAttribute('style');
      });

      // Disable Marketo stylesheet
      document.querySelectorAll('link[href*="forms2"]').forEach(function (link) {
        link.disabled = true;
      });

      // Update hint texts
      var hintEmail    = document.getElementById('InstructEmail');
      var hintEmployees = document.getElementById('InstructNumberOfEmployees');
      if (hintEmail) hintEmail.textContent = 'This lets us send important updates related to your enquiry.';
      if (hintEmployees) hintEmployees.textContent = 'This helps us recommend the right solutions and resources.';

      // Country placeholder option
      var countrySelect = document.getElementById('Country');
      if (countrySelect) {
        if (countrySelect.options[0]) {
          if (countrySelect.options[0].value !== '') {
            var placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = 'Country';
            placeholder.disabled = true;
            placeholder.selected = true;
            countrySelect.insertBefore(placeholder, countrySelect.firstChild);
          }
        }
      }

      // Move submit button to sticky footer
      var tray    = document.getElementById('eh-form-tray');
      var btnRow  = formEl.querySelector('.mktoButtonRow');
      if (tray) {
        var formBody = tray.querySelector('.eh-form-body');
        if (formBody) {
          if (btnRow) {
            var footer = document.createElement('div');
            footer.className = 'eh-form-footer';
            footer.appendChild(btnRow);
            formBody.insertAdjacentElement('afterend', footer);
          }
        }
      }

      // Auto-scroll to next empty field after filling each field
      var scrollBody = tray ? tray.querySelector('.eh-form-body') : null;
      var allFields  = Array.from(formEl.querySelectorAll(
        'input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]), select'
      ));
      allFields.forEach(function (field, index) {
        var evt = field.tagName === 'SELECT' ? 'change' : 'blur';
        field.addEventListener(evt, function () {
          if (!field.value) return;
          var next = null;
          for (var i = index + 1; i < allFields.length; i++) {
            if (!allFields[i].value) { next = allFields[i]; break; }
          }
          if (next) {
            if (scrollBody) {
              var row = next.closest('.mktoFormRow') || next.parentElement;
              requestAnimationFrame(function () {
                row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
              });
            }
          }
        });
      });

      // Override submit button text
      var submitBtn = formEl.querySelector('.mktoButton');
      if (submitBtn) submitBtn.textContent = 'Download now';

      // Redirect on successful submission
      form.onSuccess(function () {
        window.location.href = REDIRECT_URL;
        return false;
      });
    });

    try {
      MktoForms2.loadForm('https://hr.employmenthero.io', '387-SZZ-170', 1737);
    } catch (e) {
      showFormError();
    }
  }

  if (document.readyState === 'complete') {
    initMarketoForm();
  } else {
    window.addEventListener('load', initMarketoForm);
  }

  // ============================================================
  // HELPERS
  // ============================================================
  var FOCUSABLE_SELECTOR = [
    'a[href]',
    'button:not([disabled])',
    'input:not([disabled])',
    'select:not([disabled])',
    'textarea:not([disabled])',
    '[tabindex]:not([tabindex="-1"])'
  ].join(', ');

  function getFocusable(container) {
    return Array.from(container.querySelectorAll(FOCUSABLE_SELECTOR))
      .filter(function (el) { return !el.closest('[hidden]'); });
  }

  function getFirstFocusable(container) {
    return getFocusable(container)[0] || null;
  }

})();
</script>
